<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c3df0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Español">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Español desde cero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Concept : appli-jeu. Parcours de leçons en zigzag, leçons courtes en étapes variées, boutons épais, XP + série + mascotte maison (Tilde) */
:root{
  color-scheme:light;
  --bg:#f6f3ff; --card:#ffffff; --fg:#241a3d; --muted:#6f6590; --line:#e2dcf5;
  --pri:#6c3df0; --pri-d:#4b24c4; --pri-soft:#ece6ff;
  --gold:#ffb703; --gold-d:#d98e00; --flame:#ff7a1a;
  --ok:#2fb344; --ok-d:#1f8a31; --ok-soft:#dff6e3;
  --ko:#e5484d; --ko-d:#b3282d; --ko-soft:#fde4e4;
  --font:"Nunito","ui-rounded","SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#16112a; --card:#211a3a; --fg:#f2eeff; --muted:#a89fc9; --line:#34294f;
  --pri:#8f6bff; --pri-d:#5a35d1; --pri-soft:#2d2352;
  --gold:#ffc83d; --gold-d:#c98f00; --flame:#ff8f3a;
  --ok:#4cd964; --ok-d:#2f9f45; --ok-soft:#173a25;
  --ko:#ff6b70; --ko-d:#c13a3f; --ko-soft:#43202a;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;font-weight:600;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
button{font:inherit;color:inherit;font-weight:800;cursor:pointer}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100dvh}
.pad{padding:0 16px 110px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.15}
.muted{color:var(--muted)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;align-items:center;gap:14px;padding:10px 16px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:1.05rem}
.stat svg{width:24px;height:24px}
.stat.flame{color:var(--flame)}.stat.xp{color:var(--gold-d)}
@media (prefers-color-scheme: dark){.stat.xp{color:var(--gold)}}
.goal{flex:1;min-width:0;font-size:.78rem;color:var(--muted);font-weight:800;display:flex;flex-direction:column;gap:4px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s}

/* Cartes et boutons */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.btn{display:block;width:100%;border:0;border-bottom:5px solid var(--pri-d);background:var(--pri);color:#fff;border-radius:16px;padding:14px 18px;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;transition:transform .08s,border-width .08s}
.btn:active:not(:disabled){transform:translateY(4px);border-bottom-width:1px}
.btn:disabled{background:var(--line);border-bottom-color:var(--line);color:var(--muted);cursor:default}
.btn.ok{background:var(--ok);border-bottom-color:var(--ok-d)}
.btn.ko{background:var(--ko);border-bottom-color:var(--ko-d)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--line);border-bottom-width:5px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Accueil : mascotte + parcours */
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero h2{font-size:1.15rem}
.hero p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.review{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;margin-bottom:6px}
.review b{display:block;font-size:1rem}.review span{font-size:.85rem;color:var(--muted);font-weight:700}
.review svg{width:34px;height:34px;flex:none;color:var(--pri)}
.unit{margin-top:18px}
.ubanner{background:var(--uc);border-bottom:5px solid var(--ud);color:#fff;border-radius:18px;padding:14px 16px}
.ubanner small{display:block;opacity:.85;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.ubanner h2{font-size:1.2rem}
.u0{--uc:#6c3df0;--ud:#4b24c4}.u1{--uc:#0e9aa7;--ud:#0a717b}.u2{--uc:#e8590c;--ud:#ad4308}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 4px}
.lnode{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x,0));background:none;border:0;padding:0;width:140px;position:relative}
.disc{width:78px;height:78px;border-radius:50%;background:var(--uc);border-bottom:7px solid var(--ud);display:grid;place-items:center;color:#fff;transition:transform .08s,border-width .08s}
.lnode:active .disc{transform:translateY(5px);border-bottom-width:2px}
.disc svg{width:34px;height:34px}
.lnode.done .disc{background:var(--gold);border-bottom-color:var(--gold-d)}
.lname{font-size:.9rem;font-weight:800;text-align:center;line-height:1.15}
.stars{display:flex;gap:2px;height:16px}
.stars svg{width:16px;height:16px}
.bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--pri);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}

/* Navigation basse */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:6px;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:170px;border:2px solid transparent;border-radius:14px;background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}

/* Leçon */
.lesson{display:flex;flex-direction:column;min-height:100dvh}
.ltop{display:flex;align-items:center;gap:12px;padding:12px 16px}
.x{background:none;border:0;font-size:2rem;line-height:1;color:var(--muted);padding:0 6px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .35s;box-shadow:inset 0 5px 0 rgba(255,255,255,.25)}
.lbody{flex:1;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px}
.instr{font-size:1.25rem;font-weight:900}
.qbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtext{font-size:1.9rem;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.spk{width:54px;height:54px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--pri);display:grid;place-items:center;flex:none}
.spk svg{width:26px;height:26px}
.spk.big{width:96px;height:96px;border-radius:24px;background:var(--pri);color:#fff;border-color:var(--pri-d)}
.spk.big svg{width:46px;height:46px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:1.05rem}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.opt.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-d)}
.opt.bad{border-color:var(--ko);background:var(--ko-soft);color:var(--ko-d)}
.in{width:100%;font:inherit;font-weight:800;font-size:1.3rem;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.in:focus{border-color:var(--pri);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{min-width:42px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:10px;padding:7px 0}
.aline{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;padding:9px 14px;font-size:1.05rem}
.tile.used{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{border:2px solid var(--line);border-bottom-width:5px;background:var(--card);border-radius:14px;padding:12px 10px;font-size:1rem;min-height:54px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.mt.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-d);opacity:.55;cursor:default}
.mt.bad{border-color:var(--ko);background:var(--ko-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lfoot{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.lfoot.ok{background:var(--ok-soft);border-top-color:var(--ok)}
.lfoot.ko{background:var(--ko-soft);border-top-color:var(--ko)}
.fb{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fb svg{width:56px;height:56px;flex:none}
.fb h3{font-size:1.2rem}.lfoot.ok h3{color:var(--ok-d)}.lfoot.ko h3{color:var(--ko-d)}
.fb p{margin:2px 0 0;font-size:.92rem;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(20,10,50,.55);display:grid;place-items:end center;z-index:20}
.sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center}

/* Fin de leçon */
.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px}
.end h1{font-size:1.8rem}
.bigstars{display:flex;gap:8px}.bigstars svg{width:56px;height:56px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.mini{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.mini small{display:block;background:var(--c);color:#fff;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.mini b{display:block;padding:12px 4px;font-size:1.4rem}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:30;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* Guía */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri-d)}
.stack{display:flex;flex-direction:column;gap:14px}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:baseline}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pron{color:var(--muted);width:48%;font-weight:700}
.form{font-weight:900;font-size:1.1rem}
.scroll{overflow-x:auto}
.note{background:var(--pri-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cell{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column}
.cell b{font-size:1.3rem;line-height:1.1}.cell span{font-size:.85rem;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);padding:9px 0;background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .es{font-weight:900;flex:1;min-width:0}.row .fr{color:var(--muted);flex:1;min-width:0;font-weight:700}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:var(--pri);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.say{color:var(--pri);background:none;border:2px solid var(--line);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.kpi b{display:block;font-size:1.6rem}.kpi span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function wordStep(w,mode){
  const key='w:'+w[0];
  const same=W.filter(x=>x[2]===w[2]&&x[0]!==w[0]);
  const pool=shuffle(same.length>=3?same:W.filter(x=>x[0]!==w[0]));
  if(mode==='esfr')return{type:'choice',key,prompt:w[0],say:w[0],sub:'Que signifie ce mot ?',options:uniqOpts(w[1],pool.map(x=>x[1])),answer:w[1]};
  if(mode==='fres')return{type:'choice',key,prompt:w[1],sub:'Comment dit-on en espagnol ?',options:uniqOpts(w[0],pool.map(x=>x[0])),answer:w[0],say:w[0],nospk:true};
  if(mode==='listen')return{type:'choice',key,listen:true,say:w[0],sub:'Écoute et choisis ce que tu entends',options:uniqOpts(w[0],pool.map(x=>x[0])),answer:w[0]};
  const alt=[];const m=w[0].match(/^(el|la|los|las|un|una) (.+)$/);if(m)alt.push(m[2]);if(w[0].includes(' / '))w[0].split(' / ').forEach(x=>alt.push(x));
  return{type:'type',key,prompt:w[1],sub:'Écris en espagnol',answer:w[0],alt,say:w[0],nospk:true};
}
function numStep(n,mode){
  const key='n:'+n;
  const near=shuffle([-10,-2,-1,1,2,10].map(d=>n+d).filter(x=>x>=0&&x<=100&&x!==n));
  if(mode==='d2w')return{type:'choice',key,prompt:String(n),say:num(n),sub:'Quel est ce nombre en espagnol ?',options:uniqOpts(num(n),near.map(num)),answer:num(n)};
  if(mode==='w2d')return{type:'choice',key,prompt:num(n),say:num(n),sub:'Quel est ce nombre en chiffres ?',options:uniqOpts(String(n),near.map(String)),answer:String(n)};
  if(mode==='listen')return{type:'type',key,numeric:true,listen:true,say:num(n),sub:'Écoute et écris le nombre en chiffres',answer:String(n)};
  if(mode==='type_d')return{type:'type',key,numeric:true,prompt:num(n),say:num(n),sub:'Écris ce nombre en chiffres',answer:String(n)};
  return{type:'type',key,prompt:String(n),sub:'Écris ce nombre en toutes lettres',answer:num(n),say:num(n),nospk:true};
}
function verbStep(k,i,mode){
  const v=V[k],key='v:'+k+':'+i;
  const others=shuffle(v.f.filter((_,j)=>j!==i));
  if(mode==='choice')return{type:'choice',key,prompt:P[i],sub:k+' — '+v.fr,options:uniqOpts(v.f[i],others),answer:v.f[i],note:v.note,say:v.f[i],nospk:true};
  if(mode==='type')return{type:'type',key,prompt:P[i],sub:'Conjugue : '+k+' — '+v.fr,answer:v.f[i],note:v.note,say:v.f[i],nospk:true};
  const c=(CLOZE[k]||[]).find(x=>x[1]===i)||rnd(CLOZE[k]||[['___',i]]);
  return{type:'choice',key:'v:'+k+':'+c[1],prompt:c[0],sub:'Complète la phrase',options:uniqOpts(v.f[c[1]],shuffle(v.f.filter((_,j)=>j!==c[1]))),answer:v.f[c[1]],note:v.note,say:c[0].replace('___',v.f[c[1]]),nospk:true};
}
function phraseStep(idx,mode){
  const p=PH[idx],key='p:'+idx;
  if(mode==='choice'){const o=shuffle(PH.filter((_,j)=>j!==idx)).map(x=>x[1]);return{type:'choice',key,prompt:p[0],say:p[0],sub:'Que signifie cette phrase ?',options:uniqOpts(p[1],o),answer:p[1]};}
  const words=p[0].split(' ');const extra=shuffle(EXTRA.filter(x=>!words.map(w=>w.toLowerCase().replace(/[.,¿?¡!]/g,'')).includes(x))).slice(0,2);
  return{type:'tiles',key,prompt:p[1],sub:'Traduis en espagnol',answer:p[0],words:shuffle(words.concat(extra)),say:p[0],nospk:true};
}
function matchStep(pairs){return{type:'match',key:null,sub:'Associe chaque paire',pairs:pairs.map(p=>({l:p[0],r:p[1],say:p[2]}))};}

function vocabLesson(words,extraPhrases=[]){
  const ws=shuffle(words),steps=[];
  if(ws.length>=4)steps.push(matchStep(ws.slice(0,5).map(w=>[w[0],w[1],w[0]])));
  const modes=canSpeak?['esfr','fres','type','listen','fres','type','esfr','listen','type','fres']:['esfr','fres','type','fres','type','esfr','fres','type','esfr','type'];
  modes.forEach((m,i)=>steps.push(wordStep(ws[i%ws.length],m)));
  extraPhrases.slice(0,3).forEach(i=>steps.push(phraseStep(i,'tiles')));
  return steps;
}
function numLesson(lo,hi){
  const all=[];for(let n=lo;n<=hi;n++)all.push(n);
  const ns=shuffle(all),steps=[];
  steps.push(matchStep(ns.slice(0,5).map(n=>[String(n),num(n),num(n)])));
  const modes=canSpeak?['d2w','w2d','type_w','listen','d2w','type_d','w2d','type_w','listen','d2w']:['d2w','w2d','type_w','type_d','d2w','type_d','w2d','type_w','type_d','d2w'];
  modes.forEach((m,i)=>steps.push(numStep(ns[i%ns.length],m)));
  return steps;
}
function verbLesson(keys){
  const steps=[];const used=new Set();
  keys.forEach(k=>(CLOZE[k]||[]).forEach(c=>{if(steps.length<6){steps.push(verbStep(k,c[1],'cloze'));used.add(k+c[1]);}}));
  const items=shuffle(keys.flatMap(k=>[0,1,2,3,4,5].map(i=>[k,i])));
  let j=0;while(steps.length<12&&j<items.length){const[k,i]=items[j++];steps.push(verbStep(k,i,steps.length%2?'type':'choice'));}
  return shuffle(steps);
}
function phraseLesson(group){
  const idxs=shuffle(PH.map((p,i)=>i).filter(i=>PH[i][2]===group));
  const steps=[];idxs.slice(0,8).forEach((i,n)=>steps.push(phraseStep(i,n%3===2?'choice':'tiles')));
  if(canSpeak)idxs.slice(0,2).forEach(i=>{const p=PH[i];steps.push({type:'type',key:'p:'+i,listen:true,say:p[0],sub:'Écoute et écris la phrase',answer:p[0]});});
  return steps;
}
/* Repas intelligent : cible les points faibles */
function weightOf(key){const s=store.items[key];if(!s)return 2;if(s.ko>0&&s.ko>=s.ok)return 6;if(s.ok<3)return 2;return .3;}
function reviewLesson(){
  const cand=[];
  W.forEach(w=>cand.push({k:'w:'+w[0],make:()=>wordStep(w,rnd(canSpeak?['esfr','fres','type','listen']:['esfr','fres','type']))}));
  for(let n=0;n<=100;n++)cand.push({k:'n:'+n,w:n>30?.5:1,make:()=>numStep(n,rnd(canSpeak?['d2w','w2d','type_w','type_d','listen']:['d2w','w2d','type_w','type_d']))});
  Object.keys(V).forEach(k=>[0,1,2,3,4,5].forEach(i=>cand.push({k:'v:'+k+':'+i,make:()=>verbStep(k,i,rnd(['choice','type','cloze']))})));
  PH.forEach((p,i)=>cand.push({k:'p:'+i,make:()=>phraseStep(i,rnd(['tiles','choice']))}));
  const out=[];let pool=cand.slice();
  while(out.length<12&&pool.length){const wts=pool.map(c=>weightOf(c.k)*(c.w||1));const tot=wts.reduce((a,b)=>a+b,0);let r=Math.random()*tot,x=0;for(;x<pool.length;x++){r-=wts[x];if(r<=0)break;}out.push(pool.splice(Math.min(x,pool.length-1),1)[0].make());}
  return out;
}

  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{gcat=b.dataset.cat;main();});
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  const sd=$('#snd');if(sd)sd.onclick=()=>{store.sound=!store.sound;save();main();};
  const rs=$('#reset');if(rs)rs.onclick=()=>{rs.hidden=true;$('#rsure').hidden=false;};
  const rn=$('#rno');if(rn)rn.onclick=()=>{$('#rsure').hidden=true;$('#reset').hidden=false;};
  const ry=$('#ryes');if(ry)ry.onclick=()=>{store=Object.assign({},DEF,{streak:{n:0,last:''},daily:{d:'',xp:0},stars:{},items:{}});save();tab='path';main();};
}
function meHTML(){
  const done=ALL.filter(l=>store.stars[l.id]).length,stars=Object.values(store.stars).reduce((a,b)=>a+b,0);
  const mast=Object.values(store.items).filter(s=>s.ok>=2&&s.ok>s.ko).length;
  return`<div class="pad stack"><div class="card hero">${tilde('wow',64)}<div><h2>Tu progreso</h2><p>Chaque série compte.</p></div></div>
  <div class="kpis"><div class="kpi"><b>${store.xp}</b><span>XP total</span></div><div class="kpi"><b>${streak()}</b><span>jours d'affilée</span></div><div class="kpi"><b>${done}/${ALL.length}</b><span>leçons terminées</span></div><div class="kpi"><b>${mast}</b><span>mots et formes maîtrisés</span></div></div>
  <div class="card stack"><h3>Réglages</h3><button class="btn ghost" id="snd">Sons : ${store.sound?'activés':'coupés'}</button>
   <button class="btn ghost" id="reset">Réinitialiser ma progression</button>
   <div id="rsure" hidden class="stack"><p style="margin:0">Tout effacer (XP, série, étoiles) ? Impossible de revenir en arrière.</p><button class="btn ko" id="ryes">Oui, tout effacer</button><button class="btn ghost" id="rno">Non, garder</button></div></div></div>`;
}

/* Guía (fiches de révision) */
function guideHTML(){
  const subs=[['verbos','Verbos'],['numeros','Números'],['vocab','Vocabulario'],['oral','Oral']];
  let h=`<div class="pad stack"><div class="chips">${subs.map(s=>`<button class="chip" data-sub="${s[0]}" aria-pressed="${gsub===s[0]}">${s[1]}</button>`).join('')}</div>`;
  if(gsub==='verbos')h+=gVerbs();else if(gsub==='numeros')h+=gNums();else if(gsub==='vocab')h+=gVocab();else h+=gOral();
  return h+'</div>';}
function gVerbs(){const v=V[gverb];
  return`<div class="chips">${Object.keys(V).map(k=>`<button class="chip" data-verb="${k}" aria-pressed="${gverb===k}">${k}</button>`).join('')}</div>
  <div class="card stack"><div class="top"><h3>${gverb}</h3>${canSpeak?`<button class="say" data-say="${esc(v.f.join('. '))}">${SPK}Escuchar</button>`:''}</div><div class="muted">${v.fr}</div>
  <table class="tbl"><tbody>${P.map((p,i)=>`<tr><td class="pron">${p}</td><td class="form">${v.f[i]}</td></tr>`).join('')}</tbody></table><div class="note">${v.note}</div></div>
  <div class="card stack"><h3>Les verbes réguliers</h3><div class="scroll"><table class="tbl"><thead><tr><th></th><th>-ar</th><th>-er</th><th>-ir</th></tr></thead><tbody>
  ${[['yo','-o','-o','-o'],['tú','-as','-es','-es'],['él / ella / usted','-a','-e','-e'],['nosotros','-amos','-emos','-imos'],['vosotros','-áis','-éis','-ís'],['ellos / ustedes','-an','-en','-en']].map(r=>`<tr><td class="pron">${r[0]}</td><td class="form">${r[1]}</td><td class="form">${r[2]}</td><td class="form">${r[3]}</td></tr>`).join('')}</tbody></table></div>
  <div class="muted">Retire -ar / -er / -ir de l'infinitif et ajoute la terminaison : hablar → habl<b>o</b>, habl<b>as</b>…</div></div>
  <div class="card stack"><h3>Tú, usted, vosotros, ustedes</h3><div class="muted"><b>tú</b> = un ami · <b>usted</b> = un prof, un inconnu (même forme que « il/elle »). <b>vosotros</b> = « vous » entre amis (Espagne) · <b>ustedes</b> = « vous » poli ou Amérique latine (même forme que « ils/elles »).</div></div>`;}
function gNums(){const cell=n=>`<button class="cell" data-say="${num(n)}"><b>${n}</b><span>${num(n)}</span></button>`;const a=[];for(let i=0;i<=30;i++)a.push(i);
  return`<div class="card stack"><h3>De 0 à 30</h3><div class="muted">Touche un nombre pour l'entendre.</div><div class="grid">${a.map(cell).join('')}</div></div>
  <div class="card stack"><h3>Les dizaines</h3><div class="grid">${[40,50,60,70,80,90,100].map(cell).join('')}</div></div>
  <div class="card stack"><h3>La règle à retenir</h3><div class="note"><b>16 à 19</b> : dieci + chiffre → <i>dieciséis</i> (un seul mot)<br><b>21 à 29</b> : veinti + chiffre → <i>veintitrés</i> (un seul mot, accent sur 22, 23, 26)<br><b>31 à 99</b> : dizaine + <b>y</b> + chiffre, 3 mots → <i>treinta y cinco</i> (35)</div></div>`;}
function gVocab(){return`<div class="chips">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${gcat===c}">${c}</button>`).join('')}</div>
  <div class="card"><div>${catWords(gcat).map(w=>`<button class="row" data-say="${esc(w[0])}"><span class="es">${esc(w[0])}</span><span class="fr">${esc(w[1])}</span>${canSpeak?SPK:''}</button>`).join('')}</div></div>`;}
function gOral(){const rows=g=>PH.filter(p=>p[2]===g).map(r=>`<button class="row" data-say="${esc(r[0])}"><span class="es">${esc(r[0])}</span><span class="fr">${esc(r[1])}</span>${canSpeak?SPK:''}</button>`).join('');
  return`<div class="card stack"><h3>Se présenter</h3><div>${rows('pres')}</div></div><div class="card stack"><h3>Deviner un personnage</h3><div>${rows('preg')}</div><div class="muted">On parle <b>de</b> la personne : 3e personne (es, tiene, vive, habla), pas « tú ».</div></div>`;}

/* ===================== MOTEUR DE LEÇON ===================== */
function startLesson(def){
  let steps;try{steps=def.build();}catch(e){steps=[];}
  steps=steps.filter(Boolean);if(!steps.length)return;
  L={def,q:steps.slice(),n0:steps.length,total:steps.length,done:0,first:0,xp:0,combo:0,res:null};
  setNav(false);renderStep();
}
function quitDialog(){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="box">${tilde('sad',70)}<h2>¿Seguro que quieres salir ?</h2><p class="muted" style="margin:0">Tu progression de cette leçon sera perdue.</p><button class="btn" id="stay">Continuar</button><button class="btn ghost" id="leave">Salir</button></div>`;document.body.appendChild(d);
  $('#stay').onclick=()=>d.remove();$('#leave').onclick=()=>{d.remove();main();};}
function renderStep(){
  const st=L.q[0];if(!st)return finishLesson();
  L.cur=st;L.sel=null;L.checked=false;L.tiles=[];L.msel=null;L.mistakes=0;L.mdone=0;
  const pct=Math.round(L.done/L.total*100);
  let body=`<div class="instr">${st.sub||''}</div>`;
  if(st.type==='choice'){
    const q=st.listen?`<button class="spk big" id="spk" aria-label="Écouter">${SPK}</button>`:`<div class="qbox"><div class="qtext">${esc(st.prompt)}</div>${canSpeak&&st.say&&!st.nospk?`<button class="spk" id="spk" aria-label="Écouter">${SPK}</button>`:''}</div>`;
    body+=q+`<div class="opts">${st.options.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }else if(st.type==='type'){
    const q=st.listen?`<button class="spk big" id="spk" aria-label="Écouter">${SPK}</button>`:`<div class="qbox"><div class="qtext">${esc(st.prompt)}</div>${canSpeak&&st.say&&!st.nospk?`<button class="spk" id="spk" aria-label="Écouter">${SPK}</button>`:''}</div>`;
    body+=q+`<input class="in" id="ans" type="text" inputmode="${st.numeric?'numeric':'text'}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Ta réponse" placeholder="Écris ici">`;
    if(!st.numeric)body+=`<div class="keys">${['á','é','í','ó','ú','ñ','ü','¿','¡'].map(k=>`<button class="key" type="button" data-key="${k}">${k}</button>`).join('')}</div>`;
  }else if(st.type==='tiles'){
    body+=`<div class="qbox"><div class="qtext" style="font-size:1.4rem">${esc(st.prompt)}</div></div><div class="aline" id="aline"></div><div class="bank" id="bank"></div>`;
  }else if(st.type==='match'){
    const R=shuffle(st.pairs.map((p,i)=>({t:p.r,i})));
    body+=`<div class="mgrid"><div class="mcol">${st.pairs.map((p,i)=>`<button class="mt" data-side="l" data-i="${i}">${esc(p.l)}</button>`).join('')}</div><div class="mcol">${R.map(o=>`<button class="mt" data-side="r" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div></div>`;
  }
  app.innerHTML=`<div class="lesson"><div class="ltop"><button class="x" id="quit" aria-label="Quitter">×</button><div class="pbar"><i style="width:${pct}%"></i></div></div><main class="lbody">${body}</main><footer class="lfoot" id="foot" ${st.type==='match'?'hidden':''}>${st.type==='match'?'':'<button class="btn" id="check" disabled>Comprobar</button>'}</footer></div>`;
  window.scrollTo(0,0);
  $('#quit').onclick=quitDialog;
  const sp=$('#spk');if(sp)sp.onclick=()=>say(st.say);
  if(st.listen&&canSpeak)setTimeout(()=>{if(L&&L.cur===st)say(st.say);},350);
  if(st.type==='choice')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(L.checked)return;L.sel=b.dataset.v;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('#check').disabled=false;});
  if(st.type==='type'){const inp=$('#ans');inp.oninput=()=>{$('#check').disabled=!inp.value.trim();};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(L.checked)nextStep();else if(inp.value.trim())check();}};
    document.querySelectorAll('[data-key]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{if(L.checked)return;const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.key+inp.value.slice(e2);inp.focus();inp.setSelectionRange(s+1,s+1);$('#check').disabled=false;};});
    if(!st.listen||!canSpeak)inp.focus();}
  if(st.type==='tiles')drawTiles();
  if(st.type==='match')bindMatch();
  const ck=$('#check');if(ck)ck.onclick=check;
}
function drawTiles(){const st=L.cur;
  $('#aline').innerHTML=L.tiles.map((ix,n)=>`<button class="tile" data-un="${n}">${esc(st.words[ix])}</button>`).join('');
  $('#bank').innerHTML=st.words.map((w,ix)=>`<button class="tile ${L.tiles.includes(ix)?'used':''}" data-ix="${ix}">${esc(w)}</button>`).join('');
  document.querySelectorAll('[data-ix]').forEach(b=>b.onclick=()=>{if(L.checked||L.tiles.includes(+b.dataset.ix))return;L.tiles.push(+b.dataset.ix);drawTiles();});
  document.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{if(L.checked)return;L.tiles.splice(+b.dataset.un,1);drawTiles();});
  const ck=$('#check');if(ck)ck.disabled=!L.tiles.length;
}
function bindMatch(){const st=L.cur;
  document.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done')||L.checked)return;
    const side=b.dataset.side,i=+b.dataset.i;
    if(side==='l'&&st.pairs[i].say)say(st.pairs[i].say);
    if(!L.msel||L.msel.side===side){document.querySelectorAll('.mt.sel').forEach(x=>{if(x.dataset.side===side)x.classList.remove('sel');});b.classList.add('sel');L.msel={side,i,el:b};return;}
    const other=L.msel;
    if(other.i===i){b.classList.add('done');other.el.classList.remove('sel');other.el.classList.add('done');L.mdone++;L.msel=null;beep([700],.08);
      if(L.mdone===st.pairs.length)feedback(L.mistakes<=1?'ok':'ko',{match:true});}
    else{L.mistakes++;b.classList.add('bad');other.el.classList.add('bad');beep([200],.12);const a=b,c=other.el;setTimeout(()=>{a.classList.remove('bad');c.classList.remove('bad','sel');},380);L.msel=null;}
  });}
function judge(st,val){
  if(st.numeric)return String(parseInt(val,10))===st.answer?'ok':'ko';
  const acc=[st.answer,...(st.alt||[])];
  if(acc.some(x=>norm(x)===norm(val)))return'ok';
  if(acc.some(x=>fold(x)===fold(val)))return'acc';
  return'ko';}
function check(){
  if(L.checked)return;const st=L.cur;let res;
  if(st.type==='choice'){res=L.sel===st.answer?'ok':'ko';document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.remove('sel');if(b.dataset.v===st.answer)b.classList.add('good');else if(b.dataset.v===L.sel)b.classList.add('bad');});}
  else if(st.type==='type'){const v=$('#ans').value;res=judge(st,v);$('#ans').readOnly=true;}
  else if(st.type==='tiles'){const got=L.tiles.map(ix=>st.words[ix]).join(' ');res=got===st.answer?'ok':'ko';}
  feedback(res,{});
}
const PRAISE=['¡Genial!','¡Muy bien!','¡Perfecto!','¡Excelente!','¡Así se hace!','¡Fenomenal!'];
function feedback(res,opt){
  const st=L.cur;L.checked=true;L.res=res;const ok=res!=='ko';
  if(!opt.match&&$('#check'))$('#check').hidden=true;
  if(ok){L.combo++;if(!st.retry){L.first++;L.xp+=10;}else L.xp+=5;beep([660,880],.1);}else{L.combo=0;beep([240,180],.16);}
  if(st.key&&!st.retry){const s=store.items[st.key]||(store.items[st.key]={ok:0,ko:0});ok?s.ok++:s.ko++;}
  let title,sub='';
  if(ok){title=rnd(PRAISE);if(res==='acc')sub=`Pense aux accents : <b>${esc(st.answer)}</b>`;else if(L.combo>=3)sub=`Racha de ${L.combo} !`;}
  else{title='Respuesta correcta';sub=opt.match?'Quelques erreurs sur les paires. On y revient plus tard.':`<b>${esc(st.answer)}</b>${st.note?'<br>'+st.note:''}`;}
  const f=$('#foot');f.hidden=false;f.className='lfoot '+(ok?'ok':'ko');
  f.innerHTML=`<div class="fb">${tilde(ok?'happy':'sad',56)}<div><h3>${title}</h3><p>${sub}</p></div></div><button class="btn ${ok?'ok':'ko'}" id="next">Continuar</button>`;
  const n=$('#next');n.onclick=nextStep;n.focus();
  if(ok&&st.say&&canSpeak&&st.type!=='match'&&!st.listen)setTimeout(()=>say(st.say),150);
}
function nextStep(){
  const st=L.q.shift();L.done++;
  if(L.res==='ko'&&!st.retry&&st.type!=='match'){L.q.push(Object.assign({},st,{retry:true}));L.total++;}
  renderStep();
}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#6c3df0','#ffb703','#2fb344','#ff7a1a','#0e9aa7','#e5484d'];
  for(let i=0;i<44;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=rnd(cols);d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4000);}}
function finishLesson(){
  const acc=Math.round(L.first/L.n0*100);let stars=acc>=90?3:acc>=70?2:1;
  let bonus=0;if(L.first===L.n0)bonus=20;L.xp+=bonus;
  const isReview=L.def.id==='review';
  if(!isReview)store.stars[L.def.id]=Math.max(store.stars[L.def.id]||0,stars);
  store.xp+=L.xp;const d=dstr();if(store.daily.d!==d)store.daily={d,xp:0};store.daily.xp+=L.xp;
  let streakUp=false;if(store.streak.last!==d){store.streak.n=(store.streak.last===yest()?store.streak.n:0)+1;store.streak.last=d;streakUp=true;}
  save();beep([523,659,784,1046],.13);confetti();
  const xp=L.xp,title=L.def.title;
  app.innerHTML=`<div class="end">${tilde('happy',130)}<h1>${acc>=90?'¡Increíble!':'¡Lección completada!'}</h1><div class="muted">${esc(title)}</div>
  ${isReview?'':`<div class="bigstars">${[1,2,3].map(k=>star(k<=stars)).join('')}</div>`}
  <div class="cards"><div class="mini" style="--c:var(--gold-d)"><small>XP</small><b>+${xp}</b></div><div class="mini" style="--c:var(--ok-d)"><small>Precisión</small><b>${acc} %</b></div><div class="mini" style="--c:var(--flame)"><small>Racha</small><b>${streak()}</b></div></div>
  ${bonus?'<div class="muted">+20 XP de bonus : sans faute !</div>':''}${streakUp?'<div class="muted">Un jour de plus dans ta série.</div>':''}
  <div style="width:100%;display:flex;flex-direction:column;gap:10px"><button class="btn" id="home">Continuar</button><button class="btn ghost" id="again">Refaire la leçon</button></div></div>`;
  const def=L.def;$('#home').onclick=main;$('#again').onclick=()=>startLesson(def);
}

/* ===================== DÉMARRAGE ===================== */
main();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
